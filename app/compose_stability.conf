// Types the Compose compiler must treat as stable.
//
// :core is a plain Kotlin/JVM module - it carries no Compose compiler, so every
// type it exports (Transaction, Money, Category, CardKind, the enums) reaches
// :app as UNSTABLE, and a composable taking one can never skip. That made every
// row in the history recompose whenever any state on the screen changed.
//
// They are immutable data classes, value classes and enums over immutable fields.
// Nothing here is observable and nothing mutates in place, which is the condition
// this file is for.
sa.masrouf.core.*

// java.time values held inside those models.
java.time.Instant
java.time.LocalDate
