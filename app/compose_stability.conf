// Types the Compose compiler must treat as stable.
//
// :core is a plain Kotlin/JVM module - it carries no Compose compiler, so every
// type it exports (Transaction, Money, Category, CardKind, the enums) reaches
// :app as UNSTABLE, and a composable taking one can never skip. That made every
// row in the history recompose whenever any state on the screen changed.
//
// They are immutable data classes, value classes and enums over immutable fields.
// Nothing here is observable and nothing mutates in place, which is the condition
// this file is for.
// `**`, not `*`. A single star matches only the classes directly IN this package,
// and every type this file exists for lives one level deeper -
// sa.masrouf.core.model.Transaction, sa.masrouf.core.money.Money,
// sa.masrouf.core.ask.AskAnswer. So the pattern matched nothing that mattered and
// the compiler went on reporting `unstable transaction: Transaction` on the history
// row - the one composable in this app that is built hundreds of times in a scroll.
// The comment above described what was intended; the line below now does it.
sa.masrouf.core.**

// java.time values held inside those models. YearMonth was missing, which is why
// IncomeMonth - a data class of a YearMonth and two Moneys - was reported unstable
// long after Money became stable.
java.time.Instant
java.time.LocalDate
java.time.YearMonth
